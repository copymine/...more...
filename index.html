<!DOCTYPE html>
<html>
<head>
<title>...more...</title>
<style>
body {
height: 100vh;
background: #000000;
color: #ffffff;
font-family: Arial;
display: flex;
flex-direction: column;
flex-wrap: wrap;
justify-content: center;
font-size: 16px;
}
#buttonzone {
width: 100%;
height: 60vh;
border-radius: 3px;
background: #101010;
color: #ffffff;
font-family: Arial;
display: flex;
flex-direction: row;
flex-wrap: wrap;
justify-content: center;
align-items: flex-start;
font-size: 16px;
}
.title {
text-align: center;
width: 100%;
}
.nbutton {
margin: 1px;
height: auto;
border-radius: 10px;
background: #2f2f2f;
padding: 6px;
color: #ffffff;
border: none;
}
.nbutton:hover {
background: #3f3f3f;
}
.nbutton:active {
background: #5f5f5f;
}
.input {
appearance: none;
display: block;
background: #5f5f5f;
border-radius: 6px;
color: #ffffff;
}
.input::placeholder {
color: #999999;
}
</style>
</head>
<body>
<h1 class="title">...more...</h1><br>
<br><input class="input" id="queryh" onkeyup="queryHTML()" placeholder="Search...">
<br><br><br><br><br>
<div id="buttonzone"></div>
<script>
function f(url) {
window.location.href = url;
}


  
let links = [
"https://google.com",
"https://mail.google.com",
"https://calendar.google.com/calendar/u/0/r/month",
"https://chat.google.com",
"https://meet.google.com",
"https://drive.google.com",
"https://docs.google.com",
"https://sheets.google.com",
"https://slides.google.com",
"https://notepad.js.org",
"https://filen.io",
"https://scratch.mit.edu",
"https://github.com",
"https://jsfiddle.net",
"https://codepen.io",
"https://stackblitz.com",
"https://gchq.github.io/CyberChef/",
"https://orteil.dashnet.org/cookieclicker/",
]
let linksname = [
"Google",
"Google Mail",
"Google Calendar",
"Google Chat",
"Google Meet",
"Google Drive",
"Google Docs",
"Google Sheets",
"Google Slides",
"Notepad.js.org",
"Filen",
"Scratch",
"GitHub",
"JSFiddle",
"CodePen",
"StackBlitz",
"CyberChef",
"Cookie Clicker",
]


let query = ""
function queryHTML() {
query = document.getElementById("queryh").value
show()
}
function show() {
document.getElementById("buttonzone").innerHTML = ""
links.forEach((link, index) => {
if (query === "" || new URL(link).hostname.includes(query) || linksname[index].includes(query)) {
let buttonzone = document.getElementById("buttonzone");
let newbutton = document.createElement("button");
newbutton.classList.add("nbutton");
newbutton.onclick = function() {f(link)}
newbutton.textContent = linksname[index]
buttonzone.append(newbutton)
}
})
}
show();
</script>
</body>
</html>
